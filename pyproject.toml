[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plagueshield"
version = "0.1.0"
description = "Multi-agent decision support for suspected Yersinia pestis cases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "authlib>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
plagueshield = "plagueshield.cli:main"

[tool.setuptools.packages.find]
include = ["plagueshield*"]

[tool.setuptools.package-data]
plagueshield = ["data/cases/*.json", "data/public/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
